<!doctype html>
<html lang="th">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>QR สั่งอาหาร</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

body {

  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background: #f5f5f5;

  margin: 0;

  color: #222;
}

.wrap {

  max-width: 560px;

  margin: 30px auto;

  padding: 18px;
}

.box {

  background: #fff;

  border-radius: 18px;

  padding: 20px;

  box-shadow:
    0 4px 18px rgba(0,0,0,.07);
}

input {

  width: 100%;

  padding: 13px;

  border:
    1px solid #ccc;

  border-radius: 12px;

  font-size: 16px;

  box-sizing: border-box;
}

button {

  border: 0;

  border-radius: 12px;

  padding: 13px 16px;

  background: #222;

  color: #fff;

  font-weight: 800;

  font-size: 16px;

  margin-top: 12px;

  width: 100%;

  cursor: pointer;
}

.qr {

  margin: 20px auto;

  text-align: center;
}

.qr a {

  display: block;

  margin-top: 12px;

  color: #555;

  word-break: break-all;

  font-size: 12px;
}

small {

  color: #777;
}

</style>

</head>

<body>

<main class="wrap">

<section class="box">

<h1>
  QR สั่งอาหาร
</h1>

<p>
  ใช้ QR เดียวทั้งร้าน
  ลูกค้าสแกนแล้วได้เลขออเดอร์อัตโนมัติ
</p>

<label>
  ลิงก์เว็บร้าน
</label>

<input
  id="url"
  placeholder="https://ชื่อร้าน.vercel.app"
>


<button id="make">
  สร้าง QR
</button>


<div
  id="out"
  class="qr"
></div>


<small>
  พิมพ์ QR นี้ติดหน้าร้าน/จุดสั่งอาหารได้เลย
</small>

</section>

</main>


<script>

document
  .getElementById("make")
  .onclick = () => {

    const value =
      document
        .getElementById("url")
        .value
        .trim();


    if (!value) {

      alert(
        "กรุณาใส่ลิงก์เว็บร้าน"
      );

      return;

    }


    let url;


    try {

      url =
        new URL(value);

    } catch (e) {

      alert(
        "URL ไม่ถูกต้อง"
      );

      return;

    }


    const out =
      document.getElementById(
        "out"
      );


    out.innerHTML =
      "";


    const box =
      document.createElement(
        "div"
      );


    out.appendChild(
      box
    );


    new QRCode(
      box,
      {

        text:
          url.toString(),

        width:
          280,

        height:
          280,

        correctLevel:
          QRCode.CorrectLevel.H

      }
    );


    const link =
      document.createElement(
        "a"
      );


    link.href =
      url.toString();


    link.textContent =
      url.toString();


    link.target =
      "_blank";


    out.appendChild(
      link
    );

  };

</script>

</body>

</html>
